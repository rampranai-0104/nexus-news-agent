services:
  - type: web
    name: nexus-news-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: nexus_news
      - key: DB_BACKEND
        value: mongodb
      - key: NEWS_RETENTION_DAYS
        value: "7"
      - key: NEWS_REFRESH_MINUTES
        value: "15"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0